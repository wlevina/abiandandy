<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="We're getting married!">

  <!-- Link preview tags (WhatsApp, iMessage, Slack, Facebook, etc.) -->
  <meta property="og:title" content="Abi & Andy">
  <meta property="og:description" content="We're getting married!">
  <meta property="og:url" content="https://www.abiandandy.com/">
  <meta property="og:image" content="https://www.abiandandy.com/icons/link-preview.png?v=1">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Abi & Andy">
  <meta name="twitter:description" content="We're getting married!">
  <meta name="twitter:image" content="https://www.abiandandy.com/icons/link-preview.png?v=1">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="wedding_website">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=3" />

  <title>Abi & Andy</title>
  <link rel="manifest" href="manifest.json">

  <!--
      Matches the app's background colour (see backgroundColor across
      lib/widgets and lib/screens/password_gate.dart) so the page never shows
      a flash of white while main.dart.js is still downloading — see
      #boot-splash below.
    -->
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #687351;
    }
  
    #boot-splash {
      position: fixed;
      inset: 0;
      background: #687351;
      transition: opacity 400ms ease;
      z-index: 9999;
    }
  
    #boot-splash.boot-splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
  
    /* Eyeballed to roughly match where the squiggle sits on the real
         password gate (lib/screens/password_gate.dart). 975px matches
         mobileBreakpoint (lib/widgets/breakpoints.dart). */
    #boot-splash .boot-splash-mark {
      position: absolute;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%);
    }
  
    @media (max-width: 974px) {
      #boot-splash .boot-splash-mark {
        top: 37%;
      }
    }
  
    /* Echoes the squiggle divider used throughout the site (SquigglePainter).
         It never animates directly — a cover slides over it via transform
         instead, since animating the stroke itself (tried earlier) repaints
         every frame and stutters against the main-thread work of loading
         main.dart.js. */
    #boot-splash .boot-splash-squiggle-wrap {
      position: relative;
      width: 90px;
      height: 14px;
      overflow: hidden;
      animation: boot-splash-seam 1.3s ease-in-out infinite;
    }
  
    /* Path mirrors SquigglePainter's curve formula
         (lib/widgets/squiggle_painter.dart) at width 90 / height 14, so the
         shape matches exactly. */
    #boot-splash .boot-splash-squiggle {
      position: absolute;
      inset: 0;
    }
  
    #boot-splash .boot-splash-squiggle path {
      fill: none;
      stroke: #F3F0E7;
      stroke-width: 1.4;
      stroke-linecap: round;
    }
  
    /* Same colour as the splash background, so it reads as "not yet drawn"
         rather than a visible box. Sliding it fully off to the right (its own
         width, via translateX(100%)) reveals the squiggle underneath
         progressively, left edge first. */
    #boot-splash .boot-splash-cover {
      position: absolute;
      inset: 0;
      background: #687351;
      animation: boot-splash-wipe 1.3s ease-in-out infinite;
    }
  
    @keyframes boot-splash-wipe {
      0% {
        transform: translateX(0%);
      }
  
      100% {
        transform: translateX(100%);
      }
    }
  
    /* Dips to 0 right at the loop boundary so the cover's hard reset back
         to translateX(0%) happens while invisible instead of as a visible
         snap. */
    @keyframes boot-splash-seam {
  
      0%,
      100% {
        opacity: 0;
      }
  
      8%,
      92% {
        opacity: 1;
      }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>

<body>
  <div id="boot-splash">
    <div class="boot-splash-mark">
      <div class="boot-splash-squiggle-wrap">
        <svg class="boot-splash-squiggle" viewBox="0 0 90 14" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,8.4 Q13.5,0 27,7 Q40.5,14 54,5.6 Q67.5,0 90,7" />
        </svg>
        <div class="boot-splash-cover"></div>
      </div>
    </div>
  </div>

  <script>
      // Ensures at least one full draw cycle plays before hiding, so a
      // fast/cached load doesn't cut it off mid-draw and look glitchy.
      var bootSplashShownAt = Date.now();
      var MIN_BOOT_SPLASH_MS = 1300;

      // Flutter dispatches this on window once the first frame is actually
      // painted, so the splash hands off cleanly instead of on a fixed timer.
      window.addEventListener('flutter-first-frame', function () {
        var splash = document.getElementById('boot-splash');
        if (!splash) return;
        var wait = Math.max(0, MIN_BOOT_SPLASH_MS - (Date.now() - bootSplashShownAt));
        setTimeout(function () {
          splash.classList.add('boot-splash-hidden');
          setTimeout(function () { splash.remove(); }, 400);
        }, wait);
      });

    window.addEventListener('load', function (ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>

</html>
